# /etc/security/limits.d/99-loadtest.conf
# Open-file limits for interactive/SSH sessions (PAM) running load-gen tools.
# Modest SOFT (avoids slow fd-close loops in some software); programs raise their
# own soft up to HARD when needed.
# SCOPE: PAM only (login/ssh/su/cron). Does NOT affect systemd services or the
# Docker/containerd daemons (those use LimitNOFILE in their units; Docker already
# grants 524288). For a load generator run UNDER systemd, set LimitNOFILE= on its
# unit or DefaultLimitNOFILE= in /etc/systemd/system.conf.
# hard=1048576 = Debian's default fs.nr_open ceiling; to exceed it, raise fs.nr_open.
*     soft  nofile  65536
*     hard  nofile  1048576
root  soft  nofile  65536
root  hard  nofile  1048576
