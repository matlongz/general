# /etc/sysctl.d/99-kind-loadtest.conf   — apply live: sudo sysctl --system
# HOST kernel tuning for kind + host-side load generators (k6/wrk/hey).
#
# SCOPE NOTE: net.* below tune the HOST network namespace only. kind nodes are
# containers with their own netns and do NOT inherit them — for in-POD sysctls
# use a kind cluster config / containerd. inotify.* IS global (per-UID) and DOES
# reach kind containers; it is the #1 kind scaling bottleneck.

# inotify (global — reaches kind containers). kind min is 524288/512; extra headroom here.
fs.inotify.max_user_watches   = 1048576
fs.inotify.max_user_instances = 8192

# host-side network (load generators). NodePort band 30000-32767 is RESERVED so
# ephemeral allocation never steals a port kind/docker needs to bind.
net.ipv4.ip_local_port_range     = 15000 65535
net.ipv4.ip_local_reserved_ports = 30000-32767
net.core.somaxconn               = 8192
net.ipv4.tcp_max_syn_backlog     = 8192
net.core.netdev_max_backlog      = 16384
net.ipv4.tcp_tw_reuse            = 1

# ARP cache for many pod IPs (host routing to the cluster)
net.ipv4.neigh.default.gc_thresh1 = 8192
net.ipv4.neigh.default.gc_thresh2 = 32768
net.ipv4.neigh.default.gc_thresh3 = 65536
