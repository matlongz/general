# /etc/default/boot-profile — per-host config for boot_profile.sh
# Sourced as POSIX sh: keep to simple VAR="value" lines.

# Daemons stopped in SERVER mode / started in DESKTOP mode. Trim per host.
DESKTOP_DAEMONS="bluetooth.service cups.service cups-browsed.service ModemManager.service"

# CPU power profile per mode (see: powerprofilesctl list).
SERVER_PROFILE="performance"
DESKTOP_PROFILE="balanced"

# Extra services to stop ONLY in server mode (e.g. a data stack to pause during
# load tests). Space-separated. Empty = none.
SERVER_STOP_EXTRA=""

# Last-resort mode: used only when the kernel cmdline carries neither
# boot_profile= nor systemd.unit=, and no arg is passed. Hosts using the current
# GRUB entries always carry an explicit boot_profile=, so this rarely decides
# anything. Set "server" on a pure headless box with no Desktop GRUB entry.
DEFAULT_MODE="desktop"
