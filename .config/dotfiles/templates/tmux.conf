# Mouse support: click panes, drag to select, wheel to scroll
set -g mouse on

# Scrollback buffer (default is 2000 lines)
set -g history-limit 100000

# Start window/pane numbering at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Truecolor terminals (VS Code, modern terminal emulators)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Copy to the local machine's clipboard via OSC 52 (works over SSH).
# Terminal must support it: iTerm2 (enable "Applications in terminal may
# access clipboard"), VS Code terminal, kitty, WezTerm. Not Terminal.app.
set -s set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"
